- hosts: all

  vars:
    homebrew_install_path: /usr/local/homebrew
    homebrew_brew_bin_path: /usr/local/bin

    homebrew_installed_packages:
      - zsh
      - wget
      - git
      - node
      - docker-machine-nfs
    homebrew_upgrade_all_packages: no
    homebrew_taps:
      - caskroom/cask
    homebrew_cask_apps:
      - google-chrome
      - google-drive
      - iterm2
      - phpstorm
      - atom
      - 1password
      - apache-couchdb
      - mongodb
      - caffeine
      - cleanmymac
      - slack
      - hipchat
      - docker-toolbox
      - dropbox
      - evernote
      - skitch
      - firefox
      - screenflow
      - gpgtools
      - harvest
      - libreoffice
      - sequel-pro
      - spotify
      - stack
      - teamviewer
      - transmit
      - virtualbox
      - viscosity
      - wkhtmltopdf
      - whatsapp
      - skype
    homebrew_cask_appdir: /Applications
    homebrew_use_brewfile: true
    homebrew_brewfile_dir: '~'

  roles:
    - roles/homebrew

