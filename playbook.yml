- hosts: all

  vars:
    homebrew_install_path: /usr/local/homebrew
    homebrew_brew_bin_path: /usr/local/bin

    homebrew_installed_packages:
      - zsh
      - wget
      - git
      - node
      - php71
    homebrew_upgrade_all_packages: no
    homebrew_taps:
      - caskroom/cask
    homebrew_cask_apps:
      - google-chrome
      - iterm2
      - phpstorm
      - 1password
      - caffeine
      - cleanmymac
      - dropbox
      - screenflow
      - harvest
      - sequel-pro
      - spotify
      - transmit
      - viscosity
      - franz
      - slack
    homebrew_cask_appdir: /Applications
    homebrew_use_brewfile: true
    homebrew_brewfile_dir: '~'

  roles:
    - roles/homebrew

